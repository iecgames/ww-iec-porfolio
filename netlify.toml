[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Bật corepack để Netlify dùng đúng pnpm version trong package.json
  NETLIFY_USE_PNPM = "true"
  # Payload/Next build cần nhiều RAM, tránh OOM khi build
  NODE_OPTIONS = "--max-old-space-size=4096 --no-deprecation"
  # NEXT_PUBLIC_* là biến public theo thiết kế (nhúng vào client) -> bỏ qua secret scan
  # OAUTH_JWT_PRIVATE_KEY là base64 PEM (EC P-256) nên secret-scan dễ báo nhầm -> omit có chủ đích.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SERVER_URL,OAUTH_JWT_PRIVATE_KEY"
  # File template/test chỉ chứa placeholder, không phải secret thật -> không scan
  SECRETS_SCAN_OMIT_PATHS = ".env.example,test.env"

# Next.js runtime (tự xử lý SSR, API routes, Payload admin qua serverless functions)
[[plugins]]
  package = "@netlify/plugin-nextjs"
