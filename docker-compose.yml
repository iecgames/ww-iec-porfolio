services:
  # ─────────────────────────────────────────────
  # Next.js + Payload CMS app
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      args:
        # Embedded into client bundle at build time
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set NEXT_PUBLIC_SERVER_URL in your .env file}
        # Needed by generateStaticParams during next build
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in your .env file}
        # storagePlugin() loads at build time and throws without a bucket, so the
        # prerender step (media URLs) needs GCS_BUCKET even though it doesn't upload.
        GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET in your .env file}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in your .env file}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set NEXT_PUBLIC_SERVER_URL in your .env file}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in your .env file}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?Set PREVIEW_SECRET in your .env file}
      # MCP OAuth 2.1 (embedded authorization server). Must equal the public
      # https URL clients reach (e.g. the Cloudflare Tunnel hostname).
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_JWT_KID: ${OAUTH_JWT_KID:-iec-mcp-1}
      OAUTH_JWT_PRIVATE_KEY: ${OAUTH_JWT_PRIVATE_KEY:-}
      OAUTH_ACCESS_TOKEN_TTL: ${OAUTH_ACCESS_TOKEN_TTL:-3600}
      OAUTH_REFRESH_TOKEN_TTL: ${OAUTH_REFRESH_TOKEN_TTL:-2592000}
      # Google Cloud Storage — bucket for uploaded media (public bucket-level read).
      GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET in your .env file}
      # Auth: prefer GCS_CREDENTIALS (base64 service-account JSON) in Docker — raw
      # JSON gets mangled by env layers. GCS_KEY_FILE (path) or ADC also work.
      GCS_CREDENTIALS: ${GCS_CREDENTIALS:-}
      GCS_KEY_FILE: ${GCS_KEY_FILE:-}
    volumes:
      # Persist uploaded media files across container restarts
      - media_data:/app/public/media
      # Persist optimized images. Without this, every redeploy starts with an
      # empty cache and the first visitor pays for re-fetching each image from
      # GCS and re-running sharp on it.
      - image_cache:/app/.next/cache/images

volumes:
  media_data:
  image_cache:

